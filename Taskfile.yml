version: '3'

env:
  GOWORK: 'off'

tasks:
  default:
    desc: 'Default task runs the "test" and "build" tasks'
    deps:
      - test
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

###############################################################################

  go-tidy:
    desc: 'Go tidy all the things'
    run: once
    cmds:
      - go mod tidy
      - go -C examples mod tidy

  go-update:
    desc: 'Go update all the dependencies'
    run: once
    cmds:
      - go get -u ./...
      - go -C examples get -u ./...
      - go -C examples get -u tool
      - task: go-tidy

  test:
    desc: 'Run all Go tests, including the downstream consumer regression'
    cmds:
      - go test -mod=readonly ./...
      - go -C examples test -mod=readonly ./...

  test-race:
    desc: 'Run all Go tests with the race detector'
    cmds:
      - go test -mod=readonly -race ./...
      - go -C examples test -mod=readonly -race ./...

  vet:
    desc: 'Run go vet'
    cmds:
      - go vet -mod=readonly ./...
      - go -C examples vet -mod=readonly ./...

  build:
    desc: 'Build all the things'
    deps:
      - build-examples

  clean:
    desc: 'Clean built examples and generated demo assets'
    deps:
      - clean-wasm-site
    cmds:
      - rm -f bin/ntqrcode bin/ntqrcode-make
      - rm -rf .task

###############################################################################
# Examples

  build-examples:
    desc: 'Build all examples'
    deps:
      - build-ex-qrcode
      - build-ex-make

  build-ex-make:
    desc: 'Build the interactive QR generator'
    cmds:
      - go -C examples build -mod=readonly -o ../bin/ntqrcode-make ./make

  run-make:
    desc: 'Run the interactive QR generator'
    cmds:
      - go -C examples run ./make

  build-ex-qrcode:
    desc: 'Build the two-code terminal example'
    cmds:
      - go -C examples build -mod=readonly -o ../bin/ntqrcode ./qrcode
    sources:
      - qrcode/**/*.go
      - examples/qrcode/*.go
      - examples/internal/**/*.go
      - examples/go.mod
      - examples/go.sum
      - go.mod
      - go.sum
    generates:
      - bin/ntqrcode

###############################################################################
# Demo website via booba

  build-wasm:
    desc: 'Build the browser demos into web/demos/'
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p web/demos
      - for: [make, qrcode]
        cmd: go -C examples build -mod=readonly -o ../web/demos/{{.ITEM}}.wasm ./{{.ITEM}}

  build-wasm-site:
    desc: 'Build the WASM demo site into web/ and export the pinned booba runtime'
    cmds:
      - task: build-wasm
      - go -C examples tool booba-assets --no-index ../web/
      - cp LICENSE.txt web/LICENSE
      - cp THIRD_PARTY_NOTICES.md web/

  check-site:
    desc: 'Check site script syntax, required assets, and the generator under Node'
    cmds:
      - node --check web/site.js
      - node scripts/check-site.mjs
      - task: smoke-wasm

  smoke-wasm:
    desc: 'Exercise the built browser generator under Node'
    cmds:
      - node scripts/smoke-make.mjs

  serve-wasm-site:
    desc: 'Serve web/ at http://localhost:8000/ntqrcode/ (matches GH Pages prefix)'
    deps:
      - build-wasm-site
    vars:
      SERVE_DIR: /tmp/ntqrcode-site
    cmds:
      - mkdir -p "{{.SERVE_DIR}}"
      - ln -sfn "$PWD/web" "{{.SERVE_DIR}}/ntqrcode"
      - python3 -m http.server 8000 --directory "{{.SERVE_DIR}}"

  clean-wasm-site:
    desc: 'Remove generated WASM demo site artifacts'
    cmds:
      - rm -rf web/booba web/ghostty-web web/demos
      - rm -f web/wasm_exec.js web/LICENSE web/THIRD_PARTY_NOTICES.md

###############################################################################
# Dependency notices and verification

  notices:
    desc: 'Regenerate notices for native and WASM demo dependencies'
    cmds:
      - go run ./internal/tools/notices > THIRD_PARTY_NOTICES.md

  notices-check:
    desc: 'Verify that dependency notices are current'
    cmds:
      - go run ./internal/tools/notices | cmp -s - THIRD_PARTY_NOTICES.md

  vuln:
    desc: 'Scan native and WASM dependencies for known vulnerabilities (requires network)'
    vars:
      GOVULNCHECK_VERSION: v1.8.0
    cmds:
      # Build a host executable first: setting GOOS=js during go run/tool
      # would build the scanner itself for WASM instead of scanning WASM code.
      - GOWORK=off GOOS= GOARCH= GOBIN="$PWD/.task/bin" go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
      - GOWORK=off .task/bin/govulncheck -test ./...
      - cd examples && GOWORK=off ../.task/bin/govulncheck -test ./...
      - GOWORK="$PWD/wasm.work" GOOS=js GOARCH=wasm .task/bin/govulncheck ./... ./examples/...

  ci:
    desc: 'Check formatting, dependencies, tests, builds, and known vulnerabilities'
    cmds:
      - test -z "$(gofmt -l qrcode examples internal)"
      - go mod tidy -diff
      - go -C examples mod tidy -diff
      - go mod verify
      - go -C examples mod verify
      - task: test-race
      - task: vet
      - GOOS=windows GOARCH=amd64 go build -mod=readonly -o /dev/null ./...
      - GOOS=windows GOARCH=amd64 go -C examples build -mod=readonly -o /dev/null ./...
      - task: build
      - task: build-wasm-site
      - task: check-site
      - task: notices-check
      - task: vuln
